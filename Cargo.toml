[package]
name = "ci-automator"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "CI automations for hosts where hosted CI is not available"
license = "MIT"

[[bin]]
name = "cia"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
humantime = "2.4.0"
libc = "0.2.191"
serde = { version = "1.0.229", features = ["derive"] }
shell-words = "1.1.1"
toml = { version = "1.1.8", features = ["preserve_order"] }

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
