name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Check the binary is static and runs
        run: |
          bin=target/${{ matrix.target }}/release/cia
          file "$bin" | grep -q 'statically linked\|static-pie linked'
          if [ "${{ matrix.target }}" = aarch64-unknown-linux-musl ]; then
            sudo apt-get update -q && sudo apt-get install -yq qemu-user
            qemu-aarch64 "$bin" --version
          else
            "$bin" --version
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: cia-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/cia
          if-no-files-found: error

  # RHEL 7 ships glibc 2.17 and git 1.8.3. Run the musl test binaries there
  # against its stock git, mounted at the same path so CARGO_BIN_EXE_cia resolves.
  rhel7:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - name: Build test binaries
        run: |
          cargo test --locked --target x86_64-unknown-linux-musl --no-run --message-format=json \
            | jq -r 'select(.reason == "compiler-artifact" and .profile.test and .executable) | .executable' \
            > test-bins
          cat test-bins
      - name: Run tests in centos:7
        run: |
          docker run --rm -v "$PWD:$PWD" -w "$PWD" centos:7 sh -euc '
            sed -i -e "s/^mirrorlist=/#mirrorlist=/" \
                   -e "s|^#baseurl=http://mirror.centos.org|baseurl=http://vault.centos.org|" \
                   /etc/yum.repos.d/CentOS-*.repo
            yum -q -y install git
            git --version
            while read -r t; do "$t"; done < test-bins
          '
