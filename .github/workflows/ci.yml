name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Check the binary is static and runs
        run: |
          bin=target/${{ matrix.target }}/release/cia
          file "$bin" | grep -q 'statically linked\|static-pie linked'
          if [ "${{ matrix.target }}" = aarch64-unknown-linux-musl ]; then
            sudo apt-get update -q && sudo apt-get install -yq qemu-user-static
            qemu-aarch64-static "$bin" --version
          else
            "$bin" --version
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: cia-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/cia
          if-no-files-found: error
